<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="StreamyStream integration callback pages.">
  <title>StreamyStream</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; background: #0e1016; color: #f1f2f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; background: radial-gradient(ellipse at 50% 0%, #242038 0%, #0e1016 65%); }
    main { width: 100%; max-width: 540px; padding: clamp(28px, 7vw, 52px); border: 1px solid #353344; border-radius: 24px; background: #14151e; box-shadow: 0 24px 80px #00000040; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; font-size: 18px; font-weight: 650; letter-spacing: -0.4px; }
    .mark { width: 32px; height: 32px; border-radius: 10px; background: #b5a2f1; display: grid; place-items: center; }
    .mark::after { content: ""; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 10px solid #20182f; margin-left: 3px; }
    .eyebrow { margin: 0 0 16px; color: #b5a2f1; font-size: 11px; font-weight: 650; letter-spacing: 2px; text-transform: uppercase; }
    h1 { font-size: clamp(30px, 7vw, 42px); line-height: 1.15; letter-spacing: -1.2px; font-weight: 650; margin: 0 0 20px; }
    .copy { color: #b4b5c5; font-size: 16px; line-height: 1.7; margin: 0; }
    footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #2c2d3b; color: #9193a8; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true"></span>StreamyStream</div>
    <p class="eyebrow">Your library. Your space.</p>
    <h1>Local media,<br>beautifully organized.</h1>
    <p class="copy">This site hosts secure callback pages used by StreamyStream integrations.</p>
    <footer>StreamyStream &middot; Integration callbacks</footer>
  </main>
</body>
</html>
